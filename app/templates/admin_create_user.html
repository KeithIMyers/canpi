{% extends "base.html" %}
{% block title %}CanPi - Create User{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-header">
        <h5 class="mb-0"><i class="bi bi-person-plus"></i> Create New User</h5>
      </div>
      <div class="card-body">
        <form method="post" action="{{ url_for('main.create_user_route') }}">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required
                   pattern="[a-zA-Z0-9_-]+" title="Letters, numbers, hyphens, underscores only">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required minlength="4">
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select class="form-select" id="role" name="role">
              <option value="user" selected>User</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">CAN Interface Access</label>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="can_access" value="can0" id="can0" checked>
              <label class="form-check-label" for="can0">can0</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="can_access" value="can1" id="can1" checked>
              <label class="form-check-label" for="can1">can1</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="can_access" value="can9" id="can9" checked>
              <label class="form-check-label" for="can9">can9 (virtual/test)</label>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-canpi">
              <i class="bi bi-check-lg"></i> Create User
            </button>
            <a href="{{ url_for('main.admin') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
