[Seat:*]
autologin-user=$KIOSK_USER
autologin-user-timeout=0
user-session=openbox
EOF

# Create Openbox autostart for Chromium kiosk
sudo -u "$KIOSK_USER" mkdir -p "/home/$KIOSK_USER/.config/openbox"

sudo -u "$KIOSK_USER" tee "/home/$KIOSK_USER/.config/openbox/autostart" >/dev/null <<'EOF'
#!/bin/sh

# Disable screen blanking / power saving
xset s off
xset s noblank
xset -dpms

# Hide mouse cursor after a moment
unclutter -idle 0.5 -root &

# Give localhost services a few seconds to start
sleep 5

# Start Chromium in kiosk mode
exec chromium \
  --kiosk \
  --noerrdialogs \
  --disable-infobars \
  --disable-session-crashed-bubble \
  --disable-features=TranslateUI \
  --check-for-update-interval=31536000 \
  --user-data-dir="$HOME/.config/chromium-kiosk" \
  http://127.0.0.1
EOF
